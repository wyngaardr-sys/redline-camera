<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101214">
<title>REDLINE Camera</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
/*
VOICE  instrument panel: terse, uppercase status, nothing decorative
IDEA   the Flutter starter's dark camera screen, rebuilt for the browser
PICTURE the live viewfinder is the picture, filling the screen
COLOUR #101214 body, #08090a viewfinder, one red #d64a3b for shutter and brand
TYPE   system sans, heavy tracked wordmark, small status lines
*/
:root{--bg:#101214;--vf:#08090a;--panel:#202428;--red:#d64a3b;--ink:#f2f2f2;--dim:rgba(255,255,255,.55);--ok:#9db9a4;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:9px;padding:12px 20px 14px}
.brand{font-size:18px;font-weight:800;letter-spacing:2.4px}
.mode{margin-left:auto;font-weight:700;letter-spacing:1.5px}
.vf{flex:1;margin:0 12px;border-radius:18px;background:var(--vf);overflow:hidden;position:relative;display:grid;place-items:center}
video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
#view{display:none}#view.on{display:block}#view.mirror{transform:scaleX(-1)}
.chip{border:1px solid #3a3f44;background:transparent;color:var(--ink);font:600 11px/1 system-ui,sans-serif;letter-spacing:1px;border-radius:999px;padding:6px 10px;min-height:28px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--red);color:#fff;background:rgba(214,74,59,.18)}
.sci{font-size:10px;letter-spacing:.6px;color:var(--dim);margin-top:5px;min-height:14px}
.msg{padding:24px;text-align:center;color:var(--dim);max-width:30em}
.msg b{color:var(--ink)}
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--red);border-radius:50%;animation:s 0.9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.go{opacity:.6;transition:none}
.status{padding:12px 20px 8px}
.line{font-size:10px;letter-spacing:1.1px;color:rgba(255,255,255,.7);min-height:14px}
.row{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font-size:11px;color:var(--dim)}
.row b{color:var(--ink);font-size:14px}
.note{font-size:10px;color:var(--dim);margin-top:5px}
.saved{font-size:10px;color:var(--ok);margin-top:5px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 0;min-height:0}
.strip a{flex:none;width:52px;height:52px;border-radius:8px;overflow:hidden;border:1px solid #333}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.ctl{display:flex;align-items:center;justify-content:space-between;padding:12px 22px 22px}
.icon{width:48px;height:48px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icon:disabled{opacity:.35;cursor:default}
.icon svg{width:27px;height:27px}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;display:grid;place-items:center;padding:0;cursor:pointer}
.shutter i{width:60px;height:60px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.shutter:disabled{opacity:.5;cursor:default}
.shutter .spin{width:24px;height:24px;border-width:2px;border-top-color:#fff}
button:focus-visible,.fallback:focus-within{outline:2px solid var(--red);outline-offset:3px}
.fallback{display:none;margin-top:14px}
.fallback.on{display:inline-block}
.fallback label{display:inline-block;padding:11px 18px;border-radius:999px;background:var(--panel);color:var(--ink);cursor:pointer;font-size:14px}
.fallback input{position:absolute;opacity:0;width:1px;height:1px}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.flash{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d64a3b" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <span class="brand">REDLINE</span>
    <span class="mode" id="modeTop">AUTO</span>
  </header>

  <main class="vf" id="vf">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="view" aria-label="Live preview"></canvas>
    <div class="msg" id="msg"><div class="spin" style="margin:auto"></div></div>
    <div class="flash" id="flash"></div>
  </main>

  <section class="status">
    <div class="line" id="status">INITIALISING CAMERA</div>
    <div class="row"><b id="modeRow">AUTO</b><span id="lens">LENS: -</span><span id="fmt">FORMAT: JPEG</span><span id="res"></span><button class="chip" id="lookBtn" aria-pressed="true">LOOK: CINEMA</button><button class="chip" id="wideBtn" aria-pressed="false">2.39:1</button></div>
    <div class="sci" id="sci"></div>
    <div class="note" id="proNote" hidden>Manual controls are not built yet (milestone M2).</div>
    <div class="saved" id="saved" hidden></div>
  </section>
  <div class="strip" id="strip" aria-label="Captures from this session"></div>

  <nav class="ctl">
    <button class="icon" id="switch" aria-label="Switch camera" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9 13a3 3 0 0 1 5.2-2M15 13a3 3 0 0 1-5.2 2"/><path d="M14 9.5l.4 1.6-1.6.3M10 16.5l-.4-1.6 1.6-.3"/></svg>
    </button>
    <button class="shutter" id="shutter" aria-label="Take photo" disabled><i id="shutterInner"></i></button>
    <button class="icon" id="modeBtn" aria-label="Toggle camera mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </nav>
</div>

<script>
{
const $ = id => document.getElementById(id);
const video = $('video'), msg = $('msg');
const state = {
  stream: null,
  facing: 'environment',   // kept across backgrounding and failed switches
  starting: false,
  capturing: false,
  hidden: document.hidden,
  mode: 'AUTO',
  look: 'CINEMA',
  wide: false,
  captures: []
};
const view = $('view');

const local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const servedOK = location.protocol === 'https:' || (location.protocol === 'http:' && local);
const NOT_SERVED = '<b>Chrome won\'t give the live camera to a file.</b><br>This page was opened from ' +
  (location.protocol === 'content:' ? 'another app (WhatsApp, Files or Downloads)' : 'a file or plain http address') +
  '. Open it from its https:// web address instead. Meanwhile, the button below uses your normal camera.';

/* ===== REDLINE colour pipeline v0.2 =====
   Works on the camera's processed sRGB output (JPEG / video), NOT sensor RAW.
   Stages: sRGB decode -> linear light -> auto white balance (grey-world, clamped,
   half strength, faded out in clipped areas) -> exposure normalisation (half strength,
   highlight-protected) -> log contrast around mid-grey with soft toe -> highlight
   shoulder -> orange/teal colour separation -> saturation roll-off -> split tone ->
   matte black lift -> vignette -> sRGB encode -> film grain.
   A documented REDLINE transform, not a reproduction of RED IPP2. */
const LOOKS = {
  CINEMA:  { bias: 0.90, con: 1.32, knee: 0.52, lift: 0.005, satMid: 0.93, satHi: 0.58, axis: 1.25, ortho: 0.60,
             sh: [0.93, 1.0, 1.08], hi: [1.06, 1.0, 0.92], vig: 0.30, grain: 0.035 },
  NATURAL: { bias: 1.00, con: 1.07, knee: 0.60, lift: 0.0,   satMid: 0.95, satHi: 0.75, axis: 1.0,  ortho: 1.0,
             sh: [0.985, 1.0, 1.025], hi: [1.025, 1.0, 0.975], vig: 0.0, grain: 0.0 }
};
const LOOK_ORDER = ['CINEMA', 'NATURAL', 'OFF'];
const FS = `precision highp float;
varying vec2 v; uniform sampler2D t;
uniform vec3 gain, shT, hiT; uniform vec2 crop;
uniform float expo, on, con, knee, lift, satMid, satHi, axisG, orthoG, vig, grain, aspect, seed, gscale;
vec3 toLin(vec3 c){ return mix(c/12.92, pow((c+0.055)/1.055, vec3(2.4)), step(0.04045, c)); }
vec3 toSRGB(vec3 c){ c=clamp(c,0.0,1.0); return mix(c*12.92, 1.055*pow(c, vec3(1.0/2.4))-0.055, step(0.0031308, c)); }
float luma(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
float hash(vec2 p){ p = fract(p * vec2(443.897, 441.423)); p += dot(p, p.yx + 19.19); return fract((p.x + p.y) * p.x); }
const vec3 AX = vec3(0.816, -0.188, -0.547);   // orange (+) / teal (-) chroma axis, linear light
void main(){
  vec3 s = texture2D(t, vec2(v.x, crop.x + v.y * crop.y)).rgb;
  if (on < 0.5) { gl_FragColor = vec4(s, 1.0); return; }
  // Clipped pixels carry no colour information: fade white balance out there.
  float clipW = smoothstep(0.90, 1.0, min(s.r, min(s.g, s.b)));
  vec3 c = toLin(s) * mix(gain, vec3(1.0), clipW) * expo;
  // Tone: log contrast around 18% grey, soft toe, highlight shoulder.
  float L = max(luma(c), 1e-5);
  float Lc = 0.18 * pow(L / 0.18, con);
  Lc = mix(Lc, L, smoothstep(0.03, 0.0, L));
  float Ls = Lc < knee ? Lc : knee + (1.0 - knee) * (1.0 - exp(-(Lc - knee) / (1.0 - knee)));
  c *= Ls / L;
  // Colour: push chroma onto the orange/teal axis (skin sits on the orange side).
  float y = luma(c);
  vec3 d = c - y; float k = dot(d, AX); vec3 o = d - k * AX;
  c = y + k * AX * axisG + o * orthoG;
  c = max(c, 0.0); y = luma(c);
  c = mix(vec3(y), c, mix(satMid, satHi, smoothstep(0.45, 0.95, y)));
  // Split tone: cool shadows, warm highlights.
  c *= mix(vec3(1.0), shT, 1.0 - smoothstep(0.0, 0.25, y)) * mix(vec3(1.0), hiT, smoothstep(0.3, 0.9, y));
  // Matte blacks and vignette.
  c = c * (1.0 - lift) + lift * shT;
  vec2 q = (v - 0.5) * vec2(aspect, 1.0);
  float r = length(q) / length(vec2(aspect, 1.0) * 0.5);
  c *= 1.0 - vig * smoothstep(0.35, 1.05, r);
  vec3 outc = toSRGB(c);
  // Film grain, strongest in the mid-tones, sized as if the frame were 1080 px tall.
  float gy = luma(outc);
  float n = hash(floor(v * vec2(aspect, 1.0) * gscale) + seed) - 0.5;
  outc += n * grain * (1.0 - abs(gy * 2.0 - 1.0) * 0.7);
  gl_FragColor = vec4(clamp(outc, 0.0, 1.0), 1.0);
}`;
const VS = `attribute vec2 p; varying vec2 v; void main(){ v = vec2(p.x*0.5+0.5, 0.5-p.y*0.5); gl_Position = vec4(p, 0.0, 1.0); }`;

function createGrader(canvas){
  const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true, premultipliedAlpha: false, antialias: false });
  if (!gl) return null;
  const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  for (const [k, val] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, val);
  const U = {}; for (const n of ['gain','shT','hiT','crop','expo','on','con','knee','lift','satMid','satHi','axisG','orthoG','vig','grain','aspect','seed','gscale']) U[n] = gl.getUniformLocation(prog, n);
  return {
    maxTex: gl.getParameter(gl.MAX_TEXTURE_SIZE),
    draw(src, m, lookName, crop, seed){
      const L = LOOKS[lookName] || LOOKS.NATURAL, on = lookName !== 'OFF';
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src);
      gl.uniform3fv(U.gain, m.gain); gl.uniform1f(U.expo, m.expo * (on ? L.bias : 1)); gl.uniform1f(U.on, on ? 1 : 0);
      gl.uniform2fv(U.crop, crop || [0, 1]);
      gl.uniform1f(U.con, L.con); gl.uniform1f(U.knee, L.knee); gl.uniform1f(U.lift, L.lift);
      gl.uniform1f(U.satMid, L.satMid); gl.uniform1f(U.satHi, L.satHi);
      gl.uniform1f(U.axisG, L.axis); gl.uniform1f(U.orthoG, L.ortho);
      gl.uniform3fv(U.shT, L.sh); gl.uniform3fv(U.hiT, L.hi);
      gl.uniform1f(U.vig, L.vig); gl.uniform1f(U.grain, L.grain);
      gl.uniform1f(U.aspect, canvas.width / canvas.height);
      gl.uniform1f(U.gscale, Math.min(1080, canvas.height));
      gl.uniform1f(U.seed, seed || 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
  };
}

// Scene analysis on a small thumbnail: white-balance gains and exposure gain.
const probe = document.createElement('canvas'); probe.width = 96; probe.height = 54;
const pctx = probe.getContext('2d', { willReadFrequently: true });
const lin = x => { x /= 255; return x <= 0.04045 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); };
const LUT = Array.from({ length: 256 }, (_, i) => lin(i));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
function measure(src){
  pctx.drawImage(src, 0, 0, 96, 54);
  const d = pctx.getImageData(0, 0, 96, 54).data;
  let r = 0, g = 0, b = 0, n = 0, logSum = 0, m = 0; const lums = [];
  for (let i = 0; i < d.length; i += 4){
    const R = LUT[d[i]], G = LUT[d[i+1]], B = LUT[d[i+2]];
    const Y = 0.2126*R + 0.7152*G + 0.0722*B;
    lums.push(Y); logSum += Math.log(Y + 1e-4); m++;
    if (Y > 0.03 && Y < 0.85 && Math.max(R, G, B) < 0.98){ r += R; g += G; b += B; n++; } // skip clipped/black pixels
  }
  let gain = [1, 1, 1];
  if (n > 50 && r > 0 && b > 0){
    gain = [clamp(g / r, 0.85, 1.15), 1, clamp(g / b, 0.85, 1.15)];
    gain = gain.map(x => 1 + (x - 1) * 0.5);           // half strength: keep the scene's mood
  }
  lums.sort((a, c) => a - c);
  const p98 = lums[Math.floor(lums.length * 0.98)] || 1;
  const avg = Math.exp(logSum / m);
  // The camera's own auto-exposure already ran: only darken if highlights are clipping.
  let e = clamp(0.18 / Math.max(avg, 1e-3), p98 > 0.95 ? 0.8 : 0.95, 1.33);
  e = Math.sqrt(e);                                    // half strength in stops
  if (e > 1) e = Math.min(e, Math.max(1, 0.98 / p98)); // never push important highlights into clipping
  return { gain, expo: e, ev: Math.log2(e), p98 };
}

// 2.39:1 widescreen crop (centre), as a fraction of the source height.
function cropFor(w, h){
  if (!state.wide || !w || !h) return [0, 1];
  const ch = Math.min(1, (w / h) / 2.39);
  return [(1 - ch) / 2, ch];
}

let preview = null, live = { gain: [1, 1, 1], expo: 1, ev: 0 }, frameN = 0;
try { preview = createGrader(view); } catch (e) { preview = null; console.warn('REDLINE look unavailable', e); }
if (!preview){ state.look = 'OFF'; }

function fitView(){
  const vw = video.videoWidth, vh0 = video.videoHeight; if (!vw || !vh0) return;
  const vh = Math.round(vh0 * cropFor(vw, vh0)[1]);
  const box = $('vf'), bw = box.clientWidth, bh = box.clientHeight;
  const k = Math.min(bw / vw, bh / vh), cw = Math.round(vw * k), ch = Math.round(vh * k);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = Math.min(vw, Math.round(cw * dpr)), H = Math.min(vh, Math.round(ch * dpr));
  if (view.width !== W || view.height !== H){ view.width = W; view.height = H; }
  if (view.style.width !== cw + 'px' || view.style.height !== ch + 'px'){ view.style.width = cw + 'px'; view.style.height = ch + 'px'; }
}
function sciText(m){
  if (!preview) return 'REDLINE LOOK UNAVAILABLE ON THIS DEVICE (NO WEBGL)';
  if (state.look === 'OFF') return 'LOOK OFF · SHOWING CAMERA OUTPUT AS DELIVERED';
  const f = x => x.toFixed(2);
  return 'REDLINE v0.2 · ' + state.look + ' · WB R×' + f(m.gain[0]) + ' B×' + f(m.gain[2]) + ' · EV ' + (m.ev >= 0 ? '+' : '') + m.ev.toFixed(2) + (state.wide ? ' · 2.39:1' : '');
}
function renderLoop(){
  requestAnimationFrame(renderLoop);
  if (!state.stream || !preview || video.readyState < 2) return;
  if (frameN % 8 === 0){
    const m = measure(video), a = 0.15;  // smoothed so colour stays stable during a shot
    live = { gain: live.gain.map((x, i) => x + (m.gain[i] - x) * a), expo: live.expo + (m.expo - live.expo) * a };
    live.ev = Math.log2(live.expo);
  }
  if (frameN % 30 === 0) $('sci').textContent = sciText(live);
  frameN++;
  fitView();
  preview.draw(video, live, state.look, cropFor(video.videoWidth, video.videoHeight), (frameN % 64) * 0.137);
}
requestAnimationFrame(renderLoop);

async function gradeFull(blob){
  const bmp = await createImageBitmap(blob);
  const m = measure(bmp);
  const c = document.createElement('canvas');
  const g = createGrader(c);
  const crop = cropFor(bmp.width, bmp.height);
  const k = Math.min(1, g.maxTex / Math.max(bmp.width, bmp.height));
  const sw = Math.round(bmp.width * k), sh = Math.round(bmp.height * k);
  c.width = sw; c.height = Math.round(sh * crop[1]);
  let src = bmp;
  if (k < 1){ const tmp = document.createElement('canvas'); tmp.width = sw; tmp.height = sh; tmp.getContext('2d').drawImage(bmp, 0, 0, sw, sh); src = tmp; }
  g.draw(src, m, state.look, crop, Math.random() * 10);
  const out = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Encoding failed')), 'image/jpeg', 0.95));
  bmp.close && bmp.close();
  return { blob: out, m };
}

function setStatus(t){ $('status').textContent = t; }
function lensLabel(f){ return f === 'user' ? 'FRONT' : 'BACK'; }
function showMessage(html, fallback){
  showLive(false);
  msg.hidden = false;
  msg.innerHTML = html + (fallback ? fallbackHTML() : '');
  const inp = msg.querySelector('input'); if (inp) inp.addEventListener('change', onFallbackFile);
}
function fallbackHTML(){
  return '<div class="fallback on"><label>Use the phone\'s camera app<input type="file" accept="image/*" capture="environment"></label></div>';
}
function showLive(on){
  if (preview){ view.classList.toggle('on', on); }
  else { // no WebGL: show the raw video instead
    video.style.cssText = on ? 'position:static;width:100%;height:100%;object-fit:contain;opacity:1' : '';
    video.style.transform = on && state.facing === 'user' ? 'scaleX(-1)' : '';
  }
}
function updateButtons(){
  const live = !!state.stream && !state.starting;
  $('shutter').disabled = !live || state.capturing;
  $('switch').disabled = !live || state.capturing;
}

function stopStream(){
  if (state.stream){ state.stream.getTracks().forEach(t => t.stop()); }
  state.stream = null;
  video.srcObject = null;
  showLive(false);
  updateButtons();
}

async function openStream(facing){
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: facing }, width: { ideal: 4096 }, height: { ideal: 2160 } }
  });
  // Page hidden while the permission prompt / camera was opening: release it.
  if (state.hidden){ stream.getTracks().forEach(t => t.stop()); return false; }
  state.stream = stream;
  state.facing = facing;
  video.srcObject = stream;
  view.classList.toggle('mirror', facing === 'user');
  await video.play().catch(() => {});
  showLive(true);
  msg.hidden = true;
  const s = stream.getVideoTracks()[0].getSettings();
  $('lens').textContent = 'LENS: ' + lensLabel(s.facingMode || facing);
  $('res').textContent = s.width && s.height ? s.width + '×' + s.height : '';
  setStatus('AUTO EXPOSURE · AUTO WHITE BALANCE (BROWSER)');
  return true;
}

function explain(err){
  const n = err && err.name;
  if (n === 'NotAllowedError' || n === 'SecurityError')
    return servedOK
      ? '<b>Camera permission was refused.</b><br>Tap the icon left of the address bar, set Camera to Allow, then reload.'
      : NOT_SERVED;
  if (n === 'NotFoundError' || n === 'OverconstrainedError')
    return '<b>No usable camera was found.</b>';
  if (n === 'NotReadableError')
    return '<b>The camera is busy.</b><br>Another app may be using it. Close it and reload.';
  return '<b>Unable to start camera.</b><br>' + (err && err.message ? err.message : String(err));
}

async function start(){
  if (state.starting || state.stream || state.hidden) return;
  if (!servedOK || !window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus('LIVE CAMERA UNAVAILABLE · NOT OPENED FROM A WEB ADDRESS');
    showMessage(NOT_SERVED, true);
    return;
  }
  state.starting = true; updateButtons();
  showMessage('<div class="spin" style="margin:auto"></div>');
  try {
    await openStream(state.facing);
  } catch (err) {
    setStatus('CAMERA ERROR: ' + (err.name || 'UNKNOWN'));
    showMessage(explain(err), true);
  } finally {
    state.starting = false; updateButtons();
  }
}

async function switchCamera(){
  if (!state.stream || state.starting || state.capturing) return;
  const previous = state.facing;
  const next = previous === 'user' ? 'environment' : 'user';
  state.starting = true;
  setStatus('SWITCHING CAMERA');
  stopStream();  // some phones cannot open two cameras at once
  showMessage('<div class="spin" style="margin:auto"></div>');
  try {
    await openStream(next);
    const got = state.stream && state.stream.getVideoTracks()[0].getSettings().facingMode;
    if (got && got !== next) setStatus('ONLY ONE CAMERA AVAILABLE · KEPT ' + lensLabel(got));
  } catch (err) {
    try {
      await openStream(previous);
      setStatus('LENS SWITCH FAILED · KEPT ' + lensLabel(previous) + ' CAMERA');
    } catch (err2) {
      setStatus('LENS SWITCH FAILED: ' + (err.name || 'UNKNOWN'));
      showMessage(explain(err2), true);
    }
  } finally {
    state.starting = false; updateButtons();
  }
}

async function grabBlob(){
  const track = state.stream.getVideoTracks()[0];
  // Real still photo where the browser supports it (mainly Chrome on Android).
  if ('ImageCapture' in window){
    try {
      const blob = await new ImageCapture(track).takePhoto();
      if (blob && blob.size) return { blob, kind: 'STILL PHOTO' };
    } catch (_) { /* fall through to a preview frame */ }
  }
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) throw new Error('No frame available yet');
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(video, 0, 0, w, h);
  const blob = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Encoding failed')), 'image/jpeg', 0.95));
  return { blob, kind: 'PREVIEW FRAME' };
}

function stamp(){ return new Date().toISOString().replace(/:/g, '-').replace(/\..+/, ''); }

function save(blob, kind, tag){
  const type = blob.type || 'image/jpeg';
  const ext = type.includes('png') ? 'png' : type.includes('heic') ? 'heic' : 'jpg';
  const name = 'REDLINE_' + stamp() + (tag || '') + '.' + ext;
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  state.captures.unshift({ url, name });
  $('strip').insertAdjacentHTML('afterbegin', '<a href="' + url + '" download="' + name + '" title="' + name + '"><img alt="Capture ' + name + '" src="' + url + '"></a>');
  $('fmt').textContent = 'FORMAT: ' + ext.toUpperCase();
  $('saved').hidden = false;
  $('saved').textContent = 'Saved ' + name + ' to your downloads (' + kind.toLowerCase() + ').';
  setStatus('CAPTURE SAVED · ' + kind + ' · ' + ext.toUpperCase());
  return name;
}

// Non-destructive: keep the camera's original, then add the REDLINE version.
async function finish(blob, kind){
  const orig = save(blob, kind, '_ORIGINAL');
  if (state.look === 'OFF' || !preview){ $('saved').textContent = 'Saved ' + orig + ' (look off, original only).'; return; }
  try {
    const { blob: graded, m } = await gradeFull(blob);
    const name = save(graded, kind + ' + REDLINE', '_REDLINE');
    $('saved').textContent = 'Saved ' + orig + ' and ' + name + '.';
    $('sci').textContent = 'LAST CAPTURE · ' + sciText(m);
  } catch (err) {
    $('saved').textContent = 'Saved ' + orig + '. REDLINE processing failed: ' + (err.message || err);
  }
}

async function capture(){
  if (!state.stream || state.capturing || state.starting) return;
  state.capturing = true; updateButtons();
  $('shutterInner').innerHTML = '<div class="spin"></div>';
  const f = $('flash'); f.classList.add('go'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('go')));
  try {
    const { blob, kind } = await grabBlob();
    setStatus('PROCESSING · REDLINE v0.1');
    await finish(blob, kind);
  } catch (err) {
    setStatus('CAPTURE FAILED: ' + (err.message || err.name || err));
  } finally {
    state.capturing = false; updateButtons();
    $('shutterInner').innerHTML = '';
  }
}

async function onFallbackFile(e){
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  e.target.value = '';
  await finish(file, 'CAMERA APP PHOTO');
  const url = state.captures[0].url;
  showMessage('<img src="' + url + '" alt="Your photo" style="max-width:100%;max-height:52vh;border-radius:10px;display:block;margin:0 auto 10px">' +
    'Photo taken. If it didn\'t appear in your Downloads, long-press the photo and choose <b>Download image</b>.', true);
}

function toggleMode(){
  state.mode = state.mode === 'AUTO' ? 'PRO' : 'AUTO';
  $('modeTop').textContent = $('modeRow').textContent = state.mode;
  $('proNote').hidden = state.mode !== 'PRO';
}

// Lifecycle: release the camera when hidden, reopen the same lens when visible.
document.addEventListener('visibilitychange', () => {
  state.hidden = document.hidden;
  if (document.hidden){ stopStream(); setStatus('PAUSED'); }
  else start();
});
window.addEventListener('pagehide', stopStream);

$('shutter').addEventListener('click', capture);
$('switch').addEventListener('click', switchCamera);
$('modeBtn').addEventListener('click', toggleMode);
$('lookBtn').addEventListener('click', () => {
  if (!preview) return;
  state.look = LOOK_ORDER[(LOOK_ORDER.indexOf(state.look) + 1) % LOOK_ORDER.length];
  $('lookBtn').setAttribute('aria-pressed', String(state.look !== 'OFF'));
  $('lookBtn').textContent = 'LOOK: ' + state.look;
  $('sci').textContent = sciText(live);
});
$('wideBtn').addEventListener('click', () => {
  if (!preview) return;
  state.wide = !state.wide;
  $('wideBtn').setAttribute('aria-pressed', String(state.wide));
  $('sci').textContent = sciText(live);
});
if (!preview){ $('wideBtn').disabled = true; $('lookBtn').disabled = true; $('lookBtn').textContent = 'LOOK: N/A'; $('lookBtn').setAttribute('aria-pressed','false'); }
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && e.target === document.body){ e.preventDefault(); capture(); }
});

start();
if ('serviceWorker' in navigator && servedOK) navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
